<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whatitu PPT Maker</title>
<style>
:root{--blue:#f4c2d7;--rib:#fff8fb;--line:#ead4de;--work:#f6edf1;--txt:#30242a;--mut:#76656e;--hov:#f3e2ea;--act:#f8d7e5;--box:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rib:#2b2b2b;--line:#454545;--work:#1c1c1c;--txt:#eee;--mut:#aaa;--hov:#3a3a3a;--act:#6b5a10;--box:#333}}
:root[data-theme="dark"]{--rib:#2b2b2b;--line:#454545;--work:#1c1c1c;--txt:#eee;--mut:#aaa;--hov:#3a3a3a;--act:#6b5a10;--box:#333}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{font:13px "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--txt);background:var(--work);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:var(--txt)}
#top{background:var(--blue);color:#1f1a00;display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;flex:none}
#top b{font-size:15px;white-space:nowrap}
#top input{background:transparent;border:0;color:#1f1a00;font-size:13px;width:220px;max-width:36vw;padding:4px 6px;border-radius:3px}
#top input:focus{background:rgba(255,255,255,.6);outline:none}
.qa{background:transparent;border:0;color:#1f1a00;cursor:pointer;height:28px;min-width:28px;border-radius:3px;font-size:15px}
.qa:hover{background:rgba(0,0,0,.1)}
#tabs{background:var(--blue);display:flex;gap:2px;padding:0 8px;flex:none;overflow-x:auto}
#tabs button{background:transparent;border:0;color:#1f1a00;padding:7px 14px;cursor:pointer;border-radius:4px 4px 0 0;white-space:nowrap}
#tabs button:hover{background:rgba(0,0,0,.1)}
#tabs button.on{background:var(--rib);color:var(--txt);font-weight:600}
#tabs button.file{background:#2b2200;color:#ffe066}
#rib{background:var(--rib);border-bottom:1px solid var(--line);height:88px;flex:none;overflow-x:auto;overflow-y:hidden}
.pane{display:none;height:100%;padding:4px 8px;white-space:nowrap}
.pane.on{display:flex}
.grp{display:flex;flex-direction:column;justify-content:space-between;padding:0 8px;border-right:1px solid var(--line);flex:none}
.row{display:flex;gap:2px;align-items:center;min-height:30px}
.cap{text-align:center;color:var(--mut);font-size:11px;padding-bottom:2px}
.b{background:transparent;border:1px solid transparent;border-radius:3px;min-width:28px;height:28px;padding:0 6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.b:hover{background:var(--hov);border-color:var(--line)}
.b.on{background:var(--act);border-color:#b38600}
.b.big{flex-direction:column;height:56px;min-width:54px;font-size:12px;padding:2px 6px}
.b.big .ic{font-size:22px;line-height:1.1}
.b:focus-visible,select:focus-visible,#zoom:focus-visible{outline:2px solid #c02670;outline-offset:1px}
select{height:26px;background:var(--box);border:1px solid var(--line);border-radius:3px}
input[type=color]{width:28px;height:26px;padding:1px;background:var(--box);border:1px solid var(--line);border-radius:3px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
#main{flex:1;display:flex;min-height:0}
#thumbs{width:176px;flex:none;overflow-y:auto;background:var(--rib);border-right:1px solid var(--line);padding:10px 8px}
.th{position:relative;margin-bottom:10px;cursor:pointer;display:flex;gap:6px;align-items:flex-start}
.th i{font-style:normal;font-size:11px;color:var(--mut);width:14px;text-align:right;flex:none}
.th .mini{width:144px;height:81px;overflow:hidden;border:2px solid var(--line);position:relative;background:#fff;flex:none}
.th.on .mini{border-color:#c02670;box-shadow:0 0 0 1px #c02670}
.mini .st{transform:scale(.15);transform-origin:0 0;pointer-events:none}
#area{flex:1;overflow:auto;padding:20px 16px 40px;position:relative}
#wrap{margin:0 auto}
#stage{width:960px;height:540px;position:relative;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.4);transform-origin:top left;touch-action:none}
.st{width:960px;height:540px;position:relative;overflow:hidden}
.el{position:absolute;overflow:hidden;user-select:none;-webkit-user-select:none;line-height:1.25;white-space:pre-wrap;word-break:break-word}
#stage .el{cursor:move}
.el.sel{outline:2px solid #c02670;overflow:visible}
.el.ed{user-select:text;-webkit-user-select:text;cursor:text;outline:2px dashed #c02670}
.hd{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;background:#fff;border:2px solid #c02670;border-radius:50%;cursor:nwse-resize;touch-action:none}
#st{background:var(--blue);color:#1f1a00;height:26px;display:flex;align-items:center;gap:16px;padding:0 12px;flex:none;font-size:12px}
#st .sp{flex:1}
#zoom{width:120px;accent-color:#1f1a00}
#file{position:absolute;inset:0;background:var(--rib);z-index:5;display:none;padding:30px 40px;overflow:auto}
#file.on{display:block}
#file button{display:block;width:280px;max-width:100%;text-align:left;background:transparent;border:0;padding:11px 14px;font-size:15px;cursor:pointer;border-radius:4px}
#file button:hover{background:var(--hov)}
#file h2{margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.show{opacity:1}
#pres{position:fixed;inset:0;background:#000;z-index:50;display:none;align-items:center;justify-content:center}
#pres.on{display:flex}
#pres .st{transform-origin:center center;flex:none}
#pres button{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:4px;height:32px;width:32px;cursor:pointer;font-size:16px;z-index:2}
#pr{display:none}
@media (max-width:700px){#main{flex-direction:column}#thumbs{width:100%;height:92px;order:2;display:flex;gap:8px;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:6px 8px}.th{margin:0}.th i{display:none}.th .mini{width:112px;height:63px}.mini .st{transform:scale(.1167)}}
@media print{@page{size:960px 540px;margin:0}body>*:not(#pr){display:none!important}body{display:block;overflow:visible;background:#fff}#pr{display:block}#pr .st{page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="top">
  <b>Whatitu PPT Maker</b>
  <button class="qa" id="qSave" title="Simpan (Ctrl+S)">💾</button>
  <button class="qa" id="qUn" title="Urungkan (Ctrl+Z)">↶</button>
  <button class="qa" id="qRe" title="Ulangi (Ctrl+Y)">↷</button>
  <button class="qa" id="qPl" title="Presentasikan">▶</button>
  <input id="title" value="Presentasi1" aria-label="Nama presentasi">
</div>
<div id="tabs" role="tablist">
  <button class="file" data-t="file">File</button>
  <button class="on" data-t="home">Beranda</button>
  <button data-t="insert">Sisipkan</button>
  <button data-t="design">Desain</button>
  <button data-t="view">Tampilan</button>
</div>
<div id="rib">
  <div class="pane on" id="p-home">
    <div class="grp"><div class="row"><button class="b big" id="bNew"><span class="ic">➕</span>Slide baru</button><button class="b big" id="bDup"><span class="ic">⧉</span>Duplikat</button><button class="b big" id="bDel"><span class="ic">🗑</span>Hapus slide</button></div><div class="cap">Slide</div></div>
    <div class="grp">
      <div class="row"><select id="ly" aria-label="Tata letak"><option value="title">Judul</option><option value="content" selected>Judul + isi</option><option value="blank">Kosong</option></select>
      <select id="ff" aria-label="Font"><option>Calibri</option><option>Arial</option><option>Times New Roman</option><option>Georgia</option><option>Verdana</option><option>Courier New</option><option>Trebuchet MS</option></select>
      <select id="fz" aria-label="Ukuran"></select></div>
      <div class="row"><button class="b" id="bB"><b>B</b></button><button class="b" id="bI"><i>I</i></button><button class="b" id="bU"><u>U</u></button>
      <input type="color" id="fc" value="#222222" title="Warna teks / isi"><button class="b" data-a="left">≡</button><button class="b" data-a="center">☰</button><button class="b" data-a="right">≣</button></div>
      <div class="cap">Teks & Objek</div></div>
    <div class="grp"><div class="row"><button class="b big" id="bFr"><span class="ic">⬆</span>Ke depan</button><button class="b big" id="bBk"><span class="ic">⬇</span>Ke belakang</button><button class="b big" id="bRm"><span class="ic">✕</span>Hapus objek</button></div><div class="cap">Susun</div></div>
  </div>
  <div class="pane" id="p-insert">
    <div class="grp"><div class="row"><button class="b big" id="iT"><span class="ic">T</span>Kotak teks</button><button class="b big" id="iR"><span class="ic">▭</span>Persegi</button><button class="b big" id="iE"><span class="ic">◯</span>Elips</button><button class="b big" id="iL"><span class="ic">―</span>Garis</button></div><div class="cap">Bentuk & Teks</div></div>
    <div class="grp"><div class="row"><button class="b big" id="iI"><span class="ic">🖼</span>Gambar</button><input type="file" id="fi" accept="image/*" hidden></div><div class="cap">Ilustrasi</div></div>
  </div>
  <div class="pane" id="p-design">
    <div class="grp"><div class="row" id="thm"></div><div class="cap">Tema</div></div>
    <div class="grp"><div class="row"><label for="bgc">Latar slide&nbsp;</label><input type="color" id="bgc" value="#ffffff"></div><div class="cap">Latar belakang</div></div>
  </div>
  <div class="pane" id="p-view">
    <div class="grp"><div class="row"><button class="b big" id="bPl"><span class="ic">▶</span>Presentasi</button><button class="b big" id="bFit"><span class="ic">↔</span>Sesuaikan</button><button class="b big" id="bTh"><span class="ic">◐</span>Tema layar</button></div><div class="cap">Tampilan</div></div>
  </div>
</div>
<div id="main">
  <div id="thumbs"></div>
  <div id="area">
    <div id="file">
      <h2>File</h2>
      <button id="fNew">📄 Presentasi baru</button>
      <button id="fOpen">📂 Buka file proyek (.json)</button><input type="file" id="fin" accept=".json" hidden>
      <button id="fPx">⬇ Simpan sebagai .pptx (PowerPoint asli)</button>
      <button id="fJs">⬇ Simpan proyek (.json)</button>
      <button id="fHt">⬇ Simpan slideshow (.html)</button>
      <button id="fSave">💾 Simpan di browser</button>
      <button id="fPrint">🖨 Cetak / Simpan PDF</button>
      <button id="fClose">← Kembali</button>
    </div>
    <div id="wrap"><div id="stage"></div></div>
  </div>
</div>
<div id="st"><span id="pg">Slide 1 dari 1</span><span id="sv">Belum tersimpan</span><span class="sp"></span><span id="zl">100%</span><input type="range" id="zoom" min="20" max="200" value="100" aria-label="Zoom"></div>
<div id="toast" role="status"></div>
<div id="pres"><button id="pX" aria-label="Tutup">✕</button></div>
<div id="pr"></div>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},KEY='ppt-web-v1',tm,uid=0,S,H=[],RD=[],zm=1,fit=true,drag=null;
var TH=[{n:'Pink modern',bg:'#fff7fb',tx:'#38232e',ac:'#d9468f'},{n:'Pink gelap',bg:'#291b25',tx:'#fff0f7',ac:'#f178b6'},{n:'Biru',bg:'#f0f6ff',tx:'#12306b',ac:'#2f6fed'},{n:'Hijau',bg:'#f1faf3',tx:'#14432a',ac:'#2e9e5b'},{n:'Merah',bg:'#fff4f2',tx:'#5a1a12',ac:'#d9482f'}];
function say(m){var t=$('toast');t.textContent=m;t.className='show';clearTimeout(say.x);say.x=setTimeout(function(){t.className=''},1800)}
function nid(){return 'e'+(++uid)+Math.random().toString(36).slice(2,6)}
function T(x,y,w,h,t,o){return Object.assign({id:nid(),k:'t',x:x,y:y,w:w,h:h,t:t,fs:28,c:'#222222',b:0,i:0,u:0,a:'left',ff:'Calibri'},o)}
function SH(k,x,y,w,h,f){return {id:nid(),k:k,x:x,y:y,w:w,h:h,f:f}}
function th(){return TH[S.th||0]}
function mkSlide(type){var q=th(),e=[SH('rect',0,0,960,14,q.ac)];
  if(type==='title'){e.push(T(80,170,800,110,'Judul presentasi',{fs:56,b:1,a:'center',c:q.tx}),T(120,300,720,60,'Subjudul atau nama kamu',{fs:26,a:'center',c:q.tx}))}
  else if(type==='content'){e.push(T(60,36,840,80,'Judul slide',{fs:40,b:1,c:q.tx}),T(60,140,840,340,'• Poin pertama\n• Poin kedua\n• Poin ketiga',{fs:28,c:q.tx}))}
  return {bg:q.bg,els:e}}
function cur(){return S.slides[S.cur]}
function sel(){var s=cur();for(var i=0;i<s.els.length;i++)if(s.els[i].id===S.sel)return s.els[i];return null}
function snap(){H.push(JSON.stringify(S));if(H.length>60)H.shift();RD=[]}
function undo(){if(!H.length)return;RD.push(JSON.stringify(S));S=JSON.parse(H.pop());draw()}
function redo(){if(!RD.length)return;H.push(JSON.stringify(S));S=JSON.parse(RD.pop());draw()}
function mk(e){var d=document.createElement('div');d.className='el';d.dataset.id=e.id;var s=d.style;s.left=e.x+'px';s.top=e.y+'px';s.width=e.w+'px';s.height=e.h+'px';
  if(e.k==='t'){d.textContent=e.t;s.fontSize=e.fs+'px';s.color=e.c;s.fontWeight=e.b?'700':'400';s.fontStyle=e.i?'italic':'normal';s.textDecoration=e.u?'underline':'none';s.textAlign=e.a;s.fontFamily='"'+e.ff+'",Calibri,Arial,sans-serif'}
  else if(e.k==='img'){var m=document.createElement('img');m.src=e.src;m.style.cssText='width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none';d.appendChild(m)}
  else{s.background=e.f;if(e.k==='ellipse')s.borderRadius='50%'}
  return d}
function slideNode(s){var n=document.createElement('div');n.className='st';n.style.background=s.bg;s.els.forEach(function(e){n.appendChild(mk(e))});return n}
function drawThumbs(){var t=$('thumbs');t.innerHTML='';S.slides.forEach(function(s,i){var r=document.createElement('div');r.className='th'+(i===S.cur?' on':'');r.innerHTML='<i>'+(i+1)+'</i>';var m=document.createElement('div');m.className='mini';m.appendChild(slideNode(s));r.appendChild(m);r.onclick=function(){S.cur=i;S.sel=null;draw()};t.appendChild(r)})}
function drawStage(){var st=$('stage');st.innerHTML='';st.style.background=cur().bg;cur().els.forEach(function(e){var d=mk(e);if(e.id===S.sel){d.classList.add('sel');var h=document.createElement('div');h.className='hd';h.dataset.h='1';d.appendChild(h)}st.appendChild(d)})}
function syncUI(){var e=sel();$('bgc').value=cur().bg;if(e){$('ff').value=e.ff||'Calibri';$('fz').value=e.fs||28;$('fc').value=e.k==='t'?e.c:e.f||'#000000';$('bB').classList.toggle('on',!!e.b);$('bI').classList.toggle('on',!!e.i);$('bU').classList.toggle('on',!!e.u)}else{['bB','bI','bU'].forEach(function(i){$(i).classList.remove('on')})}
  $('pg').textContent='Slide '+(S.cur+1)+' dari '+S.slides.length}
function draw(){drawStage();drawThumbs();syncUI();zoom(zm);schedule()}
function schedule(){$('sv').textContent='Menyimpan…';clearTimeout(tm);tm=setTimeout(save,700)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({t:$('title').value,s:S}));$('sv').textContent='Tersimpan'}catch(e){$('sv').textContent='Tidak tersimpan (penyimpanan penuh)'}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.s&&d.s.slides&&d.s.slides.length){S=d.s;$('title').value=d.t||'Presentasi1';return}}catch(e){}
  S={th:0,cur:0,sel:null,slides:[]};S.slides.push(mkSlide('title'))}
function zoom(z){z=Math.max(.2,Math.min(2,z));zm=z;$('zoom').value=Math.round(z*100);$('zl').textContent=Math.round(z*100)+'%';$('stage').style.transform='scale('+z+')';var w=$('wrap');w.style.width=960*z+'px';w.style.height=540*z+'px'}
function fitZ(){var a=$('area');zoom(Math.min((a.clientWidth-32)/960,(a.clientHeight-40)/540,1.5))}
function pt(ev){var r=$('stage').getBoundingClientRect();return {x:(ev.clientX-r.left)/zm,y:(ev.clientY-r.top)/zm}}
$('stage').addEventListener('pointerdown',function(ev){
  var ed=ev.target.closest&&ev.target.closest('.ed');if(ed)return;
  var n=ev.target.closest('.el');
  if(!n){S.sel=null;drawStage();syncUI();return}
  var e=cur().els.filter(function(x){return x.id===n.dataset.id})[0];if(!e)return;
  var re=ev.target.dataset&&ev.target.dataset.h==='1',p=pt(ev);
  if(S.sel!==e.id){S.sel=e.id;drawStage();syncUI()}
  snap();drag={e:e,rs:re,px:p.x,py:p.y,x:e.x,y:e.y,w:e.w,h:e.h,moved:false};
  var capture=$('stage').querySelector('[data-id="'+e.id+'"]');try{(capture||$('stage')).setPointerCapture(ev.pointerId)}catch(x){}
  ev.preventDefault()});
$('stage').addEventListener('pointermove',function(ev){if(!drag)return;var p=pt(ev),dx=p.x-drag.px,dy=p.y-drag.py,e=drag.e;
  if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;
  if(drag.rs){e.w=Math.max(20,Math.round(drag.w+dx));e.h=Math.max(10,Math.round(drag.h+dy))}else{e.x=Math.round(drag.x+dx);e.y=Math.round(drag.y+dy)}
  var n=$('stage').querySelector('[data-id="'+e.id+'"]');if(n){n.style.left=e.x+'px';n.style.top=e.y+'px';n.style.width=e.w+'px';n.style.height=e.h+'px'}});
function endDrag(){if(!drag)return;if(!drag.moved)H.pop();drag=null;drawThumbs();schedule()}
$('stage').addEventListener('pointerup',endDrag);$('stage').addEventListener('pointercancel',endDrag);
$('stage').addEventListener('dblclick',function(ev){var n=ev.target.closest('.el'),e=sel();if(!n||!e||e.k!=='t'||n.dataset.id!==e.id)return;
  var h=n.querySelector('.hd');if(h)h.remove();n.classList.add('ed');n.contentEditable='true';n.focus();
  var r=document.createRange();r.selectNodeContents(n);r.collapse(false);var g=getSelection();g.removeAllRanges();g.addRange(r);
  n.onblur=function(){var t=(n.innerText||'').replace(/\n$/,'');if(t!==e.t){snap();e.t=t}n.onblur=null;draw()}});
function mod(f){var e=sel();if(!e)return say('Pilih objek dulu');snap();f(e);draw()}
$('ff').onchange=function(){var v=this.value;mod(function(e){if(e.k==='t')e.ff=v})};
$('fz').onchange=function(){var v=+this.value;mod(function(e){if(e.k==='t')e.fs=v})};
$('fc').oninput=function(){var v=this.value;var e=sel();if(!e)return;e[e.k==='t'?'c':'f']=v;drawStage();drawThumbs();schedule()};
$('fc').onchange=function(){};
$('fc').addEventListener('pointerdown',function(){if(sel())snap()});
$('bB').onclick=function(){mod(function(e){e.b=e.b?0:1})};
$('bI').onclick=function(){mod(function(e){e.i=e.i?0:1})};
$('bU').onclick=function(){mod(function(e){e.u=e.u?0:1})};
document.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){mod(function(e){e.a=b.dataset.a})}});
[12,14,16,18,20,24,28,32,36,40,48,56,64,72,96].forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;$('fz').appendChild(o)});
function add(e){snap();cur().els.push(e);S.sel=e.id;draw()}
$('iT').onclick=function(){add(T(300,220,360,60,'Teks baru',{c:th().tx}))};
$('iR').onclick=function(){add(SH('rect',360,190,240,160,th().ac))};
$('iE').onclick=function(){add(SH('ellipse',380,170,200,200,th().ac))};
$('iL').onclick=function(){add(SH('rect',280,265,400,6,th().tx))};
$('iI').onclick=function(){$('fi').click()};
